<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SpaceTimePy{% endblock %}</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f6f9; --panel: #fff; --panel2: #f8fafc; --text: #172033;
      --muted: #64748b; --line: #dbe2ea; --brand: #2563eb; --accent: #0f766e;
      --danger: #b91c1c; --code:#f8fafc; --code-text:#172033;
      --code-line-number:#94a3b8; --code-highlight:#dbeafe;
      --code-highlight-text:#172033; --code-selection:#bfdbfe;
      --syntax-keyword:#7c3aed; --syntax-name:#1e293b; --syntax-function:#0369a1;
      --syntax-constant:#be185d; --syntax-definition:#075985; --syntax-type:#b45309;
      --syntax-operator:#475569; --syntax-comment:#64748b; --syntax-string:#047857;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0f172a; --panel:#172033; --panel2:#1e293b; --text:#e5e7eb;
        --muted:#94a3b8; --line:#334155; --brand:#60a5fa; --accent:#2dd4bf;
        --code:#111827; --code-text:#e5e7eb; --code-line-number:#64748b;
        --code-highlight:#6d28d9; --code-highlight-text:#fff; --code-selection:#334155;
        --syntax-keyword:#c4b5fd; --syntax-name:#e2e8f0; --syntax-function:#7dd3fc;
        --syntax-constant:#f9a8d4; --syntax-definition:#93c5fd; --syntax-type:#fdba74;
        --syntax-operator:#cbd5e1; --syntax-comment:#94a3b8; --syntax-string:#6ee7b7; }
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui,sans-serif; }
    nav { position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:8px;
      padding:10px 18px; border-bottom:1px solid var(--line); background:var(--panel); }
    nav .brand { margin-right:14px; color:var(--text); font-size:17px; font-weight:750; text-decoration:none; }
    nav a { padding:7px 10px; border-radius:7px; color:var(--muted); text-decoration:none; }
    nav a:hover, nav a.active { color:var(--brand); background:var(--panel2); }
    nav .spacer { flex:1; }
    main { width:min(1500px, 100%); margin:auto; padding:24px; }
    h1,h2,h3 { margin-top:0; line-height:1.2; } h1 { font-size:27px; } h2 { font-size:20px; }
    .grid { display:grid; gap:16px; } .grid.two { grid-template-columns:minmax(280px, .8fr) minmax(420px, 1.5fr); }
    .grid.three { grid-template-columns:repeat(3,minmax(0,1fr)); }
    @media(max-width:900px){ .grid.two,.grid.three{grid-template-columns:1fr;} }
    .card { border:1px solid var(--line); border-radius:10px; background:var(--panel); box-shadow:0 1px 2px #0001; }
    .card-header { padding:13px 16px; border-bottom:1px solid var(--line); font-weight:700; }
    .card-body { padding:16px; } .stack { display:flex; flex-direction:column; gap:10px; }
    .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .muted { color:var(--muted); } .error { color:var(--danger); white-space:pre-wrap; }
    .badge { display:inline-block; padding:2px 7px; border-radius:999px; color:var(--muted); background:var(--panel2); border:1px solid var(--line); font-size:12px; }
    .badge.ok { color:var(--accent); } .badge.brand { color:var(--brand); }
    button,.button,input,select { min-height:34px; padding:6px 10px; border:1px solid var(--line); border-radius:7px;
      color:var(--text); background:var(--panel); font:inherit; }
    button,.button { cursor:pointer; text-decoration:none; } button.primary,.button.primary { color:white; border-color:#2563eb; background:#2563eb; }
    input { min-width:160px; } .grow { flex:1; }
    table { width:100%; border-collapse:collapse; } th,td { padding:8px 10px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
    th { color:var(--muted); font-size:12px; text-transform:uppercase; }
    .list-item { padding:11px 13px; border:1px solid var(--line); border-radius:8px; background:var(--panel); cursor:pointer; }
    .list-item:hover,.list-item.selected { border-color:var(--brand); }
    pre,code { font-family:ui-monospace,SFMono-Regular,Consolas,monospace; }
    pre.code { margin:0; padding:14px; overflow:auto; border-radius:8px; color:var(--code-text); background:var(--code); }
    .code-line { display:block; min-height:1.45em; padding:0 7px; white-space:pre; }
    .code-line.active { color:var(--code-highlight-text); background:var(--code-highlight); } .line-number { display:inline-block; width:48px; color:var(--code-line-number); user-select:none; }
    .kv { display:grid; grid-template-columns:minmax(120px,.35fr) 1fr; gap:1px; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
    .kv > * { padding:8px 10px; background:var(--panel2); overflow-wrap:anywhere; }
    .kv > :nth-child(odd) { color:var(--muted); font-weight:600; }
    .timeline { display:flex; align-items:center; gap:5px; min-height:48px; overflow:auto; padding:8px 2px; }
    .timeline button { min-width:34px; height:34px; padding:0; border-radius:50%; } .timeline button.active { color:white; background:var(--brand); }
    details { border:1px solid var(--line); border-radius:8px; padding:8px 10px; } summary { cursor:pointer; font-weight:650; }
    svg.graph { width:100%; height:620px; border:1px solid var(--line); border-radius:8px; background:var(--panel2); }
  </style>
</head>
<body>
  <nav>
    <a class="brand" href="/">SpaceTimePy</a>
    <a data-nav="/" href="/">Function Calls</a>
    <a data-nav="/stack-recordings" href="/stack-recordings">Stack Recordings</a>
    <a data-nav="/sessions" href="/sessions">Sessions & Branches</a>
    <a data-nav="/graph" href="/graph">Object Graph</a>
    <span class="spacer"></span>
    <a href="/docs">API Docs</a>
    <span id="db-status" class="badge">Loading…</span>
  </nav>
  <main>{% block content %}{% endblock %}</main>
  <script>
    const API_URL = {{ api_url|tojson }};
    const api = path => `${API_URL}${path}`;
    const escapeHtml = value => String(value ?? '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    async function fetchJson(path, options) {
      const response = await fetch(api(path), options);
      if (!response.ok) { let message = `${response.status} ${response.statusText}`; try { message = (await response.json()).detail || message; } catch {} throw new Error(message); }
      return response.json();
    }
    function valueText(item) {
      if (!item) return 'None';
      const value = item.value;
      if (value && value.encoding === 'base64' && value.media_type) return `[${value.media_type}]`;
      return typeof value === 'string' ? value : JSON.stringify(value, null, 2);
    }
    function variableTable(values) {
      const entries = Object.entries(values || {});
      if (!entries.length) return '<p class="muted">No captured values.</p>';
      return `<div class="kv">${entries.map(([name,item]) => `<div>${escapeHtml(name)}</div><div><span class="badge">${escapeHtml(item.type)}</span> <code>${escapeHtml(valueText(item))}</code></div>`).join('')}</div>`;
    }
    const currentPath = location.pathname;
    document.querySelectorAll('[data-nav]').forEach(link => { const target=link.dataset.nav; if (currentPath===target || (target!=='/' && currentPath.startsWith(target))) link.classList.add('active'); });
    fetchJson('/api/db-info').then(info => { document.getElementById('db-status').textContent = `${info.session_count} sessions · ${info.branch_count} branches`; }).catch(error => { const status=document.getElementById('db-status'); status.textContent='API error'; status.classList.add('error'); status.title=error.message; });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
