{% extends "base.html" %}
{% block title %}SpaceTimePy · Object Graph{% endblock %}
{% block content %}<div class="row"><div><h1>Trace Object Graph</h1><p class="muted">Sessions, branches, steps, calls, snapshots, code, and stored values.</p></div><span class="grow"></span><label><input id="isolated" type="checkbox"> Show isolated</label><button id="reload">Reload</button></div><div class="grid two"><section class="card"><div class="card-body"><svg id="graph" class="graph"></svg></div></section><section class="card"><div class="card-header">Node Details</div><div id="node-details" class="card-body"><p class="muted">Select a node.</p></div></section></div>{% endblock %}
{% block scripts %}
<script>
  const colors={session:'#2563eb',branch:'#7c3aed',step:'#0891b2',function_call:'#dc2626',external_call:'#ea580c',snapshot:'#16a34a',code:'#4f46e5',stored_value:'#64748b'};
  async function draw(){const data=await fetchJson(`/api/object-graph?show_isolated=${document.getElementById('isolated').checked}&max_nodes=1000`);const svg=document.getElementById('graph'),entries=Object.entries(data.nodes).slice(0,240),present=new Set(entries.map(([id])=>id)),width=900,height=620,cx=width/2,cy=height/2,radius=Math.min(width,height)*.41;svg.setAttribute('viewBox',`0 0 ${width} ${height}`);const positions={};entries.forEach(([id],i)=>{const angle=2*Math.PI*i/Math.max(entries.length,1);positions[id]={x:cx+radius*Math.cos(angle),y:cy+radius*Math.sin(angle)};});let html=`<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>`;data.edges.filter(edge=>present.has(edge[0])&&present.has(edge[1])).forEach(edge=>{const a=positions[edge[0]],b=positions[edge[1]];html+=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#94a3b8" stroke-opacity=".35" marker-end="url(#arrow)"/>`;});entries.forEach(([id,node])=>{const p=positions[id],color=colors[node.type]||'#64748b';html+=`<g data-node="${escapeHtml(id)}" style="cursor:pointer"><circle cx="${p.x}" cy="${p.y}" r="8" fill="${color}"/><title>${escapeHtml(node.label||id)}</title></g>`;});svg.innerHTML=html;svg.querySelectorAll('[data-node]').forEach(element=>element.onclick=()=>{const id=element.dataset.node,node=data.nodes[id];document.getElementById('node-details').innerHTML=`<h2>${escapeHtml(node.label||id)}</h2><span class="badge">${escapeHtml(node.type)}</span><p><code>${escapeHtml(id)}</code></p><pre>${escapeHtml(JSON.stringify(node,null,2))}</pre>`;});}
  document.getElementById('reload').onclick=()=>draw().catch(error=>document.getElementById('node-details').innerHTML=`<p class="error">${escapeHtml(error.message)}</p>`);draw().catch(error=>document.getElementById('node-details').innerHTML=`<p class="error">${escapeHtml(error.message)}</p>`);
</script>
{% endblock %}
