{% extends "base.html" %}
{% block title %}SpaceTimePy · Session {{ session_id }}{% endblock %}
{% block content %}<div id="header"><h1>Session {{ session_id }}</h1></div><div class="grid two"><section class="card"><div class="card-header">Branch Tree</div><div id="branches" class="card-body stack"></div></section><section class="card"><div class="card-header">Branch Steps</div><div id="steps" class="card-body"><p class="muted">Select a branch.</p></div></section></div>{% endblock %}
{% block scripts %}
<script>
  const sessionId={{ session_id|tojson }};
  function stepName(step){if(step.function_call)return step.function_call.qualified_name||step.function_call.function;if(step.stack_snapshot)return `Line ${step.stack_snapshot.line}`;return 'Step';}
  async function loadBranch(id,item){document.querySelectorAll('.list-item').forEach(x=>x.classList.remove('selected'));item?.classList.add('selected');const branch=await fetchJson(`/api/branch/${id}?resolve=true`);document.getElementById('steps').innerHTML=`<div class="row"><strong>${escapeHtml(branch.name||`Branch ${id}`)}</strong><span class="badge">${escapeHtml(branch.status)}</span><span class="badge brand">${branch.steps.length} resolved steps</span></div><div class="stack" style="margin-top:12px">${branch.steps.map(step=>`<details><summary>#${step.position} · ${escapeHtml(stepName(step))}</summary><p class="muted">Step ${step.id} · ${escapeHtml(step.kind)}${step.source_step_id?` · source ${step.source_step_id}`:''}</p><pre>${escapeHtml(JSON.stringify(step,null,2))}</pre></details>`).join('')}</div>`;}
  fetchJson(`/api/session/${sessionId}`).then(session=>{document.getElementById('header').innerHTML=`<div class="row"><h1 style="margin:0">${escapeHtml(session.name||`Session ${session.id}`)}</h1><span class="badge ${session.status==='completed'?'ok':''}">${escapeHtml(session.status)}</span><span class="badge">${escapeHtml(session.step_kind)}</span></div><p class="muted">${escapeHtml(session.description||'')} · ${escapeHtml(session.start_time||'')}</p>`;document.getElementById('branches').innerHTML=session.branches.map(branch=>`<div class="list-item" data-id="${branch.id}" style="margin-left:${branch.parent_branch_id?24:0}px"><div class="row"><strong>${escapeHtml(branch.name||`Branch ${branch.id}`)}</strong><span class="badge">${escapeHtml(branch.status)}</span></div><small class="muted">${branch.parent_branch_id?`fork of ${branch.parent_branch_id} at step ${branch.forked_from_step_id}`:'root'} · ${branch.step_count} own steps</small></div>`).join('');document.querySelectorAll('[data-id]').forEach(item=>item.onclick=()=>loadBranch(item.dataset.id,item));const first=document.querySelector('[data-id]');if(first)loadBranch(first.dataset.id,first);}).catch(error=>document.getElementById('header').innerHTML=`<p class="error">${escapeHtml(error.message)}</p>`);
</script>
{% endblock %}
